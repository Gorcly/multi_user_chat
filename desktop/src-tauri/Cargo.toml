[package]
name = "multi-user-chat-desktop"
version = "0.1.0"
description = "Tauri desktop client for the multi-user chat system"
authors = ["Gorcly"]
edition = "2021"

[lib]
name = "multi_user_chat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

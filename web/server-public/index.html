<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多用户聊天系统服务端</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f4f7f8;
        color: #182026;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(720px, calc(100vw - 40px));
        padding: 36px;
        border: 1px solid #d7dee2;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(24, 32, 38, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #5f6f78;
        line-height: 1.7;
      }

      .port {
        margin-top: 24px;
        display: inline-flex;
        padding: 8px 12px;
        border-radius: 999px;
        background: #e7f5ef;
        color: #176346;
        font-size: 14px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>服务端界面</h1>
      <p>服务端界面下一步完善。本端口当前只用于和客户端界面区分访问入口。</p>
      <div class="port">默认端口 8081</div>
    </main>
  </body>
</html>
